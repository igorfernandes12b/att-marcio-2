<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastrar filme · Lista de Filmes</title>
</head>
<body>
    <header class="topbar">
        <div class="topbar__inner">
            <p class="topbar__title">Lista de Filmes</p>
            <nav>
                <ul class="topbar__nav">
                    <li><a href="index.html">Acervo</a></li>
                    <li><a href="cadastro.html" aria-current="page">Cadastrar</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="page-header">
            <div>
                <h1>Cadastrar filme</h1>
                <p>Preencha a ficha técnica para adicionar um novo filme ao acervo.</p>
            </div>
        </div>

        <div class="form-card">
            <div class="feedback" id="feedback"></div>

            <form id="form-cadastro" novalidate>
                <div class="campo">
                    <label for="nome">Nome do filme</label>
                    <input type="text" id="nome" name="nome" required maxlength="150" autocomplete="off">
                </div>

                <div class="campo">
                    <label for="genero">Gênero</label>
                    <input type="text" id="genero" name="genero" required maxlength="80" autocomplete="off">
                </div>

                <div class="campo">
                    <label for="duracao">Duração (minutos)</label>
                    <input type="number" id="duracao" name="duracao" required min="1" max="1000" step="1">
                </div>

                <div class="campo">
                    <label for="classificacao">Classificação indicativa</label>
                    <input type="number" id="classificacao" name="classificacao" required min="0" max="18" step="1">
                    <small>Use 0 para "Livre".</small>
                </div>

                <div class="form-acoes">
                    <button type="submit" class="btn btn--primary">Cadastrar filme</button>
                    <a href="index.html" class="btn btn--ghost">Cancelar</a>
                </div>
            </form>
        </div>
    </main>

    <script src="cadastro.js"></script>
</body>
</html>
